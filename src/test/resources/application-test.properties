spring.application.name=biooffset
server.port=8080

# Banco de dados em memória para testes unitários e CI (H2 com compatibilidade Oracle)
spring.datasource.url=jdbc:h2:mem:biooffset_test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Desabilita o Flyway nos testes (a estrutura é gerada pelo Hibernate em memória)
spring.flyway.enabled=false

# Hibernate gera o schema automaticamente em memória para o teste
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Segredo de JWT padrão para os testes
palavra.secreta=toranja-teste-secret
