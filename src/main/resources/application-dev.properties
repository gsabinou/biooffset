spring.application.name=biooffset

server.port=8080

# config do oracle db
spring.datasource.url=${URL}
spring.datasource.username=${USER}
spring.datasource.password=${SENHA}

# comando para alterar a baseline do Flyway e não conflitar ao instanciar API
spring.flyway.baseline-version=0

# o comando abaixo é necessário para quando se está usando oracle com flyway
spring.flyway.baselineOnMigrate=true
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

# variável de ambiente da palavra secreta do token JWT, usada para criptografar
palavra.secreta=${JWT.SECRET:toranja}

# comando usado para mostrar os scripts SQL que são utilizados pelo Spring JPA
# spring.jpa.show-sql=true